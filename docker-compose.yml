version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: lemon-api:local
    container_name: lemon-api
    ports:
      - "8000:8000"
    environment:
      # ── Project ──────────────────────────────────────────
      PROJECT_NAME: "Lemon"
      VERSION: "0.1.0"
      DEBUG: "false"
      # ── AWS (uses host credentials via volume mount) ──────
      AWS_REGION: "us-east-1"
      AWS_ACCOUNT_ID: "375243950000"
      # ── DynamoDB ─────────────────────────────────────────
      DYNAMO_TABLE_PREFIX: "lemon"
      # ── Bedrock ──────────────────────────────────────────
      BEDROCK_MODEL_ID: "anthropic.claude-3-sonnet-20240229-v1:0"
      BEDROCK_EMBEDDING_MODEL_ID: "amazon.titan-embed-text-v2:0"
      # ── OpenSearch ────────────────────────────────────────
      OPENSEARCH_ENDPOINT: "https://9tekwdal9w5pd4utjhw0.us-east-1.aoss.amazonaws.com"
      OPENSEARCH_COLLECTION_NAME: "lemon-activity"
      OPENSEARCH_INDEX: "activity-embeddings"
      # ── Security ─────────────────────────────────────────
      SECRET_KEY: "local-dev-secret-change-in-prod"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
    volumes:
      # Mount host AWS credentials so the container can call AWS services
      - ~/.aws:/home/lemon/.aws:ro
    env_file:
      - .env  # override any of the above with a local .env file (git-ignored)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
